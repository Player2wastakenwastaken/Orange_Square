<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orange Square</title>
    <meta
      name="description"
      content="Orange Square — a quiet mark. One shape. One color. Nowhere else to look."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__wash"></div>
      <div class="atmosphere__grain"></div>
      <div class="atmosphere__orb atmosphere__orb--a"></div>
      <div class="atmosphere__orb atmosphere__orb--b"></div>
    </div>

    <main class="stage">
      <header class="brand">
        <p class="brand__name">Orange Square</p>
        <h1 class="brand__line">One shape. One color.</h1>
      </header>

      <div class="mark" aria-hidden="true">
        <div class="mark__square"></div>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
